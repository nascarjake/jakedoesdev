name: Sync approved updates to GitHub Pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-approved-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      published_sha: ${{ steps.commit.outputs.published_sha }}
      should_sync: ${{ steps.control.outputs.should_sync }}
    env:
      UPDATES_API_URL: ${{ vars.UPDATES_API_URL || 'https://jakedoesdev.com/api/updates' }}
      SYNC_CONTROL_URL: https://jakedoesdev.com/api/updates/sync-control
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check publish schedule
        id: control
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          curl --fail --silent --show-error "$SYNC_CONTROL_URL" > /tmp/update-sync-control.json
          echo "manual_requested_at=$(jq -r '.manualRequestedAt' /tmp/update-sync-control.json)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(jq -r '.due' /tmp/update-sync-control.json)" = "true" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "No approved-update sync is due yet."
          fi

      - name: Materialize approved public updates
        if: steps.control.outputs.should_sync == 'true'
        run: npm run updates:sync

      - name: Commit generated public updates
        if: steps.control.outputs.should_sync == 'true'
        id: commit
        run: |
          git add -A -- content/updates
          if git diff --cached --quiet -- content/updates; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish approved updates"
          git push
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record completed sync
        if: steps.control.outputs.should_sync == 'true'
        env:
          SYNC_ACK_TOKEN: ${{ secrets.UPDATES_SYNC_TOKEN }}
          MANUAL_REQUESTED_AT: ${{ steps.control.outputs.manual_requested_at }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --argjson manualRequestedAt "$MANUAL_REQUESTED_AT" --arg runUrl "$RUN_URL" +            '{manualRequestedAt:$manualRequestedAt,runUrl:$runUrl}' > /tmp/update-sync-ack.json
          curl --fail --silent --show-error --retry 3 -X POST "$SYNC_CONTROL_URL" +            -H "content-type: application/json" -H "x-updates-sync-token: $SYNC_ACK_TOKEN" +            --data-binary @/tmp/update-sync-ack.json > /dev/null

  publish:
    needs: sync
    if: needs.sync.outputs.published_sha != ''
    uses: ./.github/workflows/deploy-pages.yml
    with:
      source_ref: ${{ needs.sync.outputs.published_sha }}
